<!-- ============ PLAYLIST / STATION SELECTOR SECTION ============ -->
<div class="playlist-nav-wrapper" hidden>
  <div class="playlist-nav-header">
    <span class="nav-title">📻 Select Radio Playlist:</span>
    <span class="auto-advance-badge" title="When a playlist finishes, the next one automatically plays!">🔁 Auto-Play Next Enabled</span>
  </div>

  <div class="station-switcher" role="tablist" aria-label="Select Radio Station">
    <button class="station-btn active" data-playlist="office" role="tab" aria-selected="true">
      <span class="stn-emoji">🏢</span>
      <span class="stn-info">
        <strong class="stn-name">Office (TCS)</strong>
        <small class="stn-desc">Soulful 2000s &amp; Chai</small>
      </span>
    </button>

    <button class="station-btn" data-playlist="auto" role="tab" aria-selected="false">
      <span class="stn-emoji">🛺</span>
      <span class="stn-info">
        <strong class="stn-name">Auto (Jhankar)</strong>
        <small class="stn-desc">Street Bass Booster</small>
      </span>
    </button>

    <button class="station-btn" data-playlist="truck" role="tab" aria-selected="false">
      <span class="stn-emoji">🚚</span>
      <span class="stn-info">
        <strong class="stn-name">Truck (Highway)</strong>
        <small class="stn-desc">Dhaba Punjabi Beats</small>
      </span>
    </button>

    <button class="station-btn" data-playlist="monsoon" role="tab" aria-selected="false">
      <span class="stn-emoji">🌧️</span>
      <span class="stn-info">
        <strong class="stn-name">Monsoon (90s)</strong>
        <small class="stn-desc">Late Night Melodies</small>
      </span>
    </button>

    <button class="station-btn" data-playlist="tapri" role="tab" aria-selected="false">
      <span class="stn-emoji">☕</span>
      <span class="stn-info">
        <strong class="stn-name">Chai Tapri</strong>
        <small class="stn-desc">Roadside Golden Hits</small>
      </span>
    </button>

    <button class="station-btn" data-playlist="indipop" role="tab" aria-selected="false">
      <span class="stn-emoji">🎸</span>
      <span class="stn-info">
        <strong class="stn-name">Indipop &amp; Cassette</strong>
        <small class="stn-desc">College 2000s Bands</small>
      </span>
    </button>

    <button class="station-btn" data-playlist="latest" role="tab" aria-selected="false">
      <span class="stn-emoji">🎧</span>
      <span class="stn-info">
        <strong class="stn-name">Latest Hits</strong>
        <small class="stn-desc">2024–26 Chartbusters</small>
      </span>
    </button>
  </div>
</div>
