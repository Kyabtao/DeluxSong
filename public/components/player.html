<!-- ============ AUDIO PLAYER DECK — "POCKET CASSETTE" MICRO DECK ============
     Reference copy of the deck in public/index.html.
     Colours come from css/variables.css via css/player-redesign.css, which
     also compresses every zone into a single slim row (micro fascia strip,
     one-line LCD with 18px spools, hairline seek, 26px transport keys). -->
<div class="player mini" id="player" aria-label="Audio player">
  <!-- Dual-buffer slots: standby player pre-cues the next track for gapless, reload-free transitions -->
  <div class="yt-holder" id="ytHolder">
    <div class="yt-slot on" id="ytSlotA"><div id="ytplayerA"></div></div>
    <div class="yt-slot" id="ytSlotB"><div id="ytplayerB"></div></div>
  </div>

  <!-- Fascia: brand wordmark, the record emblem that turns while a track
       plays, the on-air lamp, and the live station chip -->
  <div class="player-fascia">
    <div class="player-brand">
      <span class="disc" id="disc" title="Spinning retro vinyl record">
        <span class="disc-hole"></span>
      </span>
      <span class="player-brand-name">टीसीएस <em>Deck</em></span>
      <span class="player-lamp" aria-hidden="true"><i></i>on air</span>
    </div>
    <span class="player-station-chip" id="stationBadge">🏢 TCS Office Mode</span>
    <button class="ctl small dock-toggle" id="dockBtn" type="button" title="Minimize Player (D)" aria-label="Minimize the player to a micro bar" aria-expanded="true">📻</button>
  </div>

  <!-- The opening song starts on arrival. Browsers hold back *audible*
       media until the first touch, so when that happens the deck runs the
       song muted and offers sound here instead of sitting silent. -->
  <button class="deck-unmute" id="unmuteBtn" type="button" hidden>
    <span class="deck-unmute-ico" aria-hidden="true">🔊</span>
    <span class="deck-unmute-text">Radio is on — tap anywhere for sound</span>
  </button>

  <!-- Cassette window: two take-up reels beside the amber LCD readout -->
  <div class="cassette-well">
    <div class="cassette" aria-hidden="true">
      <div class="reels">
        <div class="reel" id="reelA"></div>
        <div class="reel" id="reelB"></div>
      </div>
      <span class="cassette-label">TCS Radio · Side A</span>
    </div>

    <div class="np">
      <div class="np-text">
        <div class="np-badge-row">
          <span class="np-deck-label">◉ now playing</span>
          <span class="np-track-counter" id="trackCounter">Track 1 / 7</span>
        </div>
        <div class="np-title" id="npTitle">Nostalgia Loading...</div>
        <div class="np-credit">Credits: <span id="npCredit">YouTube</span></div>
      </div>
    </div>
  </div>

  <div class="seek">
    <span class="time" id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek track position" />
    <span class="time" id="dur">0:00</span>
  </div>

  <div class="controls">
    <button class="ctl" id="prev" title="Previous Track (Left Arrow)" aria-label="Previous Track">⏮</button>
    <button class="ctl play" id="play" title="Play / Pause (Space)" aria-label="Play or Pause Track">▶</button>
    <button class="ctl" id="next" title="Next Track (Right Arrow)" aria-label="Next Track">⏭</button>
    <button class="ctl small on" id="shuffle" title="Toggle Shuffle Mode" aria-label="Shuffle Track Order">🔀</button>
    
    <div class="vol" title="Volume Slider">
      <button class="vol-btn" id="volBtn" title="Mute / Unmute" aria-label="Toggle Mute">
        <span id="volIcon">🔊</span>
      </button>
      <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume Slider" />
    </div>

    <button class="ctl small" id="listBtn" title="Open Playlist Sidebar" aria-label="Open Playlist Sidebar" aria-expanded="false">☰</button>
    <button class="ctl small" id="videoBtn" title="Show Video (📺)" aria-label="Toggle Video Display">📺</button>
  </div>

  <!-- Ambient Sound Mixer Row -->
  <div class="rainrow" id="rainRow" hidden>
    <span>🌧️ Baarish Volume</span>
    <input type="range" id="rainVol" min="0" max="100" value="45" aria-label="Rain Sound Volume" />
  </div>
</div>
