<!-- ============ PLAYLIST DRAWER SECTION ============ -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title-box">
      <h3>📻 Aaj ki Playlist</h3>
      <span class="drawer-active-stn" id="drawerStnLabel">Office (TCS)</span>
    </div>
    <button class="x" type="button" id="drawerClose" aria-label="Close Playlist">×</button>
  </div>
  
  <div class="drawer-tabs" id="drawerTabs">
    <!-- Populated dynamically via JS -->
  </div>

  <div class="drawer-connect-banner">
    <span>🎵 Want a song added or removed?</span>
    <button class="btn-link-sm" id="drawerConnectBtn" type="button">Connect with Umair →</button>
  </div>

  <ol class="tracks" id="tracks"></ol>
  <p class="drawer-note">✨ Auto-advance is on. When this playlist ends, the next playlist plays automatically!</p>
</aside>
